<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp 20 tháng 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: 3 màn nối tiếp — 1 bông hồng nở giữa màn → vườn hồng phủ kín màn hình → thiệp một cột chỉ có lời chúc, nổi trên vườn */
:root {
  --bg: #fbeeea;
  --paper: #fff8f5;
  --ink: #4a1027;
  --ink-soft: #7d4a5c;
  --rose: #c2365f;
  --gold: #a87a2a;
  --line: #ecd3d0;
  --font-display: "Cormorant Garamond", "Times New Roman", serif;
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-script: "Great Vibes", "Brush Script MT", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e0c15;
    --paper: #2a1320;
    --ink: #fbe3ea;
    --ink-soft: #c99aab;
    --rose: #f2789b;
    --gold: #d9b064;
    --line: #4a2737;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e0c15;
  --paper: #2a1320;
  --ink: #fbe3ea;
  --ink-soft: #c99aab;
  --rose: #f2789b;
  --gold: #d9b064;
  --line: #4a2737;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.65;
  overflow-x: hidden;
}
[hidden] { display: none !important; }

canvas.layer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
#garden { z-index: 0; opacity: 0; transition: opacity 0.6s ease; }
#garden.on { opacity: 1; }
#petals { z-index: 3; }

.screen {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  padding-inline: 16px;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  transition: opacity 0.6s ease;
}
.screen.out { opacity: 0; pointer-events: none; }

/* Màn 1: một bông hồng */
.intro-inner {
  display: grid;
  justify-items: center;
  gap: 6px;
  text-align: center;
}
.flower-btn {
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  border-radius: 16px;
  width: min(72vw, 300px);
  aspect-ratio: 5 / 7;
  max-width: 100%;
  transition: transform 0.4s ease;
}
.flower-btn:hover { transform: scale(1.04); }
.flower-btn canvas { display: block; width: 100%; height: 100%; }
.flower-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; }
.intro-lead {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1.6rem, 5vw, 2.2rem);
  line-height: 1.2;
  color: var(--ink);
  text-wrap: balance;
}
.intro-hint {
  margin: 0;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--rose);
  opacity: 0;
  transition: opacity 0.8s ease;
}
.intro-hint.ready { opacity: 1; animation: breathe 2.4s ease-in-out 0.8s infinite; }
@keyframes breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}

/* Màn 2: vườn hồng */
.garden-caption {
  position: fixed;
  top: calc(14vh + env(safe-area-inset-top, 0px));
  left: 16px;
  right: 16px;
  z-index: 2;
  margin: 0;
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(1.8rem, 5vw, 3rem);
  color: var(--ink);
  text-wrap: balance;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.8s ease, transform 0.8s ease;
  pointer-events: none;
}
.garden-caption.on { opacity: 1; transform: none; }

/* Màn 3: thiệp */
#cardScreen {
  background: color-mix(in srgb, var(--bg) 50%, transparent);
  opacity: 0;
  pointer-events: none;
}
#cardScreen.on { opacity: 1; pointer-events: auto; }
.card {
  position: relative;
  width: 100%;
  max-width: 560px;
  background: var(--paper);
  border: 1px solid var(--line);
  outline: 1px solid var(--line);
  outline-offset: -12px;
  border-radius: 4px;
  box-shadow: 0 30px 70px -34px color-mix(in srgb, var(--ink) 50%, transparent);
  padding: clamp(28px, 6vw, 52px) clamp(24px, 6vw, 56px) clamp(32px, 6vw, 52px);
  display: grid;
  justify-items: center;
  gap: 14px;
  text-align: center;
  transform: translateY(28px) scale(0.98);
  transition: transform 0.9s cubic-bezier(.2,.8,.2,1);
}
#cardScreen.on .card { transform: none; }
.card-close {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--paper);
  color: var(--ink-soft);
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}
.card-close:hover { color: var(--rose); border-color: var(--rose); transform: rotate(90deg); }
.card-close:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.card-close svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.reopen-btn {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: 16px;
  z-index: 4;
  font: 500 0.88rem/1 var(--font-body);
  padding: 11px 18px;
  border-radius: 999px;
  border: 1px solid var(--rose);
  background: var(--paper);
  color: var(--rose);
  cursor: pointer;
  box-shadow: 0 8px 22px -14px var(--rose);
  animation: rise 0.5s ease both;
}
.reopen-btn:hover { background: var(--rose); color: var(--paper); }
.reopen-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.card-rose { width: 120px; height: 120px; max-width: 100%; display: block; margin-top: -8px; }
.to {
  font-size: 0.76rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-soft);
  margin: 0;
}
.to strong { color: var(--rose); font-weight: 600; letter-spacing: 0.08em; }
h1 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.9rem, 5vw, 2.6rem);
  line-height: 1.12;
  margin: 0;
  text-wrap: balance;
}
h1 em { color: var(--rose); }
.to svg {
  width: 14px;
  height: 14px;
  fill: var(--rose);
  vertical-align: -2px;
  margin-left: 4px;
  animation: beat 1.4s ease-in-out infinite;
}
.wish {
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(1.15rem, 2.6vw, 1.4rem);
  line-height: 1.5;
  max-width: 36ch;
  margin: 0;
  text-wrap: pretty;
}
.gift-btn {
  margin-top: 8px;
  font: 600 1rem/1.2 var(--font-body);
  padding: 15px 28px;
  border-radius: 999px;
  border: 0;
  background: var(--rose);
  color: var(--paper);
  cursor: pointer;
  box-shadow: 0 12px 26px -14px var(--rose);
  transition: transform 0.15s ease, opacity 0.3s ease;
}
.gift-btn:hover:not(:disabled) { transform: translateY(-2px); }
.gift-btn:active:not(:disabled) { transform: scale(0.97); }
.gift-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.gift-btn:disabled { opacity: 0.55; cursor: default; }

/* hiện lần lượt từng dòng của thiệp */
.reveal { opacity: 0; transform: translateY(10px); }
#cardScreen.on .reveal {
  animation: rise 0.7s ease forwards;
  animation-delay: calc(var(--i) * 140ms + 350ms);
}
@keyframes rise { to { opacity: 1; transform: none; } }

/* Thông báo nhỏ */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  z-index: 4;
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px 9px 12px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--paper);
  font-size: 0.86rem;
  line-height: 1.35;
  box-shadow: 0 10px 28px -12px color-mix(in srgb, var(--ink) 70%, transparent);
  animation: toastIn 0.5s cubic-bezier(.2,.8,.2,1) both;
}
.toast svg { flex: none; width: 16px; height: 16px; fill: var(--rose); animation: beat 1.2s ease-in-out infinite; }
@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 16px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
@keyframes beat {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.25); }
  60% { transform: scale(0.95); }
}

@media (prefers-reduced-motion: reduce) {
  .intro-hint.ready, .toast, .toast svg { animation: none; }
  .reveal { opacity: 1; transform: none; }
  #cardScreen.on .reveal { animation: none; }
  .to svg { animation: none; }
  .screen, #garden, .garden-caption, .card, .flower-btn { transition-duration: 0.01s; }
}
</style>
</head>
<body>

<canvas id="garden" class="layer" aria-hidden="true"></canvas>
<canvas id="petals" class="layer" aria-hidden="true"></canvas>

<!-- Màn 1 -->
<section class="screen" id="introScreen">
  <div class="intro-inner">
    <p class="intro-lead">Tặng 1 bông hồng nhỏ,...</p>
    <button class="flower-btn" id="flowerBtn" type="button" aria-label="Chạm vào bông hồng để mở thiệp">
      <canvas id="introFlower"></canvas>
    </button>
    <p class="intro-hint" id="introHint">Chạm vào bông hồng</p>
  </div>
</section>

<!-- Màn 2 -->
<p class="garden-caption" id="gardenCaption">Thêm em nữa thành cả vườn hoa,...</p>

<!-- Màn 3 -->
<section class="screen" id="cardScreen" aria-hidden="true">
  <article class="card">
    <button class="card-close" id="closeBtn" type="button" aria-label="Đóng thiệp để xem vườn hoa">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"/></svg>
    </button>
    <canvas class="card-rose reveal" id="cardRose" style="--i:0" aria-hidden="true"></canvas>
    <p class="to reveal" style="--i:1">Gửi đến <strong id="toName"></strong><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.1C.9 8.6 2.9 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.8 0 5.8 4.1 4.3 7.4C19.5 16.4 12 21 12 21z"/></svg></p>
    <h1 class="reveal" style="--i:2">Chúc mừng ngày <em>Phụ nữ Việt Nam</em> 20.10</h1>
    <p class="wish reveal" id="wish" style="--i:3"></p>
    <button class="gift-btn reveal" id="giftBtn" type="button" style="--i:5">Bấm vào đây để nhận quà</button>
  </article>
</section>

<button class="reopen-btn" id="reopenBtn" type="button" hidden>Xem lại thiệp</button>

<div class="toast" id="toast" role="status" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.1C.9 8.6 2.9 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.8 0 5.8 4.1 4.3 7.4C19.5 16.4 12 21 12 21z"/></svg>
  <span>Món quà đang được gửi đến bạn, chờ trong 30s nhé &lt;3</span>
</div>

<script>
/* ====== SỬA NỘI DUNG THIỆP Ở ĐÂY ====== */
var CONFIG = {
  guiDen: "em",
  loiChuc: "Chúc em luôn rạng rỡ như những đóa hoa trong vườn này, luôn khoẻ mạnh để vượt qua hết những mục tiêu lớn đã đặt ra. Mong em luôn được yêu thương, hôm nay và cả những ngày sau nữa.",
  thoiGianVuonHoa: 5000, // mili-giây hiển thị vườn hồng trước khi hiện thiệp

  // Báo về mail khi người nhận bấm "nhận quà"
  emailNhanThongBao: "huyphan@gtvseo.com", // gửi qua FormSubmit.co (cần đưa trang lên web, xác nhận 1 lần)
  appsScriptUrl: "https://script.google.com/macros/s/AKfycbyWioOvbja1r99QFzfdBEBJopeaNtlE87RYuddvoW_Ooz1DsSmCBw4IHOwQtZEBDYMb/exec" // nếu dùng Google Apps Script thì dán link Web app vào đây, sẽ dùng thay FormSubmit
};
/* ====================================== */

(function () {
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const clamp01 = v => Math.min(1, Math.max(0, v));
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => 1 - Math.pow(1 - clamp01(t), 3);

  document.getElementById("toName").textContent = CONFIG.guiDen;
  document.getElementById("wish").textContent = CONFIG.loiChuc;

  // Màu hoa: 3 sắc hồng (chủ đạo, ~60%) + đỏ, trắng kem, cam đào, vàng, tím oải hương
  const PALETTES = [
    { deep: "#6e0b26", mid: "#b81e48", light: "#e44d73", edge: "#ff9db4" },
    { deep: "#9c2a4a", mid: "#dc5f84", light: "#f496b0", edge: "#ffd2de" },
    { deep: "#b0526a", mid: "#ec9bb0", light: "#f8cad6", edge: "#fff1f4" }
  ];
  const ACCENT_PALETTES = [
    { deep: "#55051a", mid: "#9e1030", light: "#d22c4d", edge: "#f37a8d" },
    { deep: "#c4a184", mid: "#efdcca", light: "#faf1e7", edge: "#ffffff" },
    { deep: "#b4452b", mid: "#f07e5e", light: "#fbb094", edge: "#ffdccc" },
    { deep: "#b07c10", mid: "#efbd2c", light: "#fadd78", edge: "#fff4c4" },
    { deep: "#6c3f8f", mid: "#a777c9", light: "#cfa9e6", edge: "#efdcfa" }
  ];
  const pick = list => list[Math.floor(Math.random() * list.length)];
  const pickPalette = () => (Math.random() < 0.6 ? pick(PALETTES) : pick(ACCENT_PALETTES));
  const LEAF = { dark: "#2a5230", mid: "#4f7f45", light: "#7aa865", vein: "#a5c98f" };
  const STEM = "#46703d";

  let gold = "#a87a2a";
  let bgColor = "#fbeeea";
  function readTokens() {
    const cs = getComputedStyle(document.documentElement);
    gold = cs.getPropertyValue("--gold").trim() || gold;
    bgColor = cs.getPropertyValue("--bg").trim() || bgColor;
  }
  readTokens();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTokens);
  new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function fit(canvas, ctx) {
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w: r.width, h: r.height };
  }

  // số ngẫu nhiên cố định theo seed: mỗi bông có dáng cánh riêng, giữ nguyên qua mọi khung hình
  function seeded(seed) {
    let a = Math.floor(seed * 100000) | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Gió: sóng chậm + sóng nhanh + cơn gió lướt ngang vườn
  function windAt(x, t, phase) {
    if (reduceMotion) return 0;
    return 0.032 * Math.sin(t / 1900 + x * 4)
      + 0.016 * Math.sin(t / 1100 + x * 9 + 1.3)
      + 0.03 * Math.pow(Math.max(0, Math.sin(t / 4300 - x * 2.2)), 3)
      + 0.008 * Math.sin(t / 720 + phase);
  }

  /* ---------- Hoa hồng ---------- */
  // mép cánh lượn sóng, mỗi cánh lệch dáng một chút
  function rimPoints(L, W, sk, wv) {
    const tx = sk * W;
    return [
      [-W * 0.38 + tx, -L * 0.92],
      [-W * 0.16 + tx, -L * (1.0 + wv[0] * 0.07)],
      [tx * 1.1, -L * (0.95 + wv[1] * 0.06)],
      [W * 0.17 + tx, -L * (1.0 + wv[2] * 0.07)],
      [W * 0.38 + tx, -L * 0.92]
    ];
  }
  function traceRim(ctx, pts) {
    for (let i = 1; i < pts.length - 1; i++) {
      const last = i === pts.length - 2;
      const ex = last ? pts[i + 1][0] : (pts[i][0] + pts[i + 1][0]) / 2;
      const ey = last ? pts[i + 1][1] : (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], ex, ey);
    }
  }
  function petalPath(ctx, L, W, sk, wv) {
    const tx = sk * W;
    const pts = rimPoints(L, W, sk, wv);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-W * 0.62, -L * 0.1, -W * 0.72 + tx * 0.4, -L * 0.68, pts[0][0], pts[0][1]);
    traceRim(ctx, pts);
    ctx.bezierCurveTo(W * 0.72 + tx * 0.4, -L * 0.68, W * 0.62, -L * 0.1, 0, 0);
    ctx.closePath();
  }
  function rimPath(ctx, L, W, sk, wv) {
    const pts = rimPoints(L, W, sk, wv);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    traceRim(ctx, pts);
  }

  // 5 vòng cánh, ngoài to sáng → trong nhỏ đậm
  const RINGS = [
    { n: 5, L: 1.0, W: 1.12, rot: 0.0, k: 0 },
    { n: 5, L: 0.82, W: 0.98, rot: 0.63, k: 1 },
    { n: 4, L: 0.64, W: 0.84, rot: 0.25, k: 2 },
    { n: 4, L: 0.48, W: 0.72, rot: 1.05, k: 3 },
    { n: 3, L: 0.34, W: 0.6, rot: 0.45, k: 4 }
  ];

  function drawRoseHead(ctx, s, open, pal, seed, shadow) {
    const o = ease(open);
    const rnd = seeded(seed);
    ctx.save();
    ctx.scale(1, 0.82);

    // đài hoa
    ctx.fillStyle = LEAF.dark;
    const sl = s * (0.42 + 0.32 * (1 - o));
    for (let i = 0; i < 5; i++) {
      const len = sl * (0.85 + rnd() * 0.3);
      ctx.save();
      ctx.rotate(seed * 0.7 + i * TAU / 5 + 0.3 + (rnd() - 0.5) * 0.3);
      ctx.beginPath();
      ctx.moveTo(-s * 0.1, 0);
      ctx.quadraticCurveTo(-s * 0.09, -len * 0.6, s * 0.02, -len);
      ctx.quadraticCurveTo(s * 0.05, -len * 0.6, s * 0.1, 0);
      ctx.fill();
      ctx.restore();
    }

    for (const ring of RINGS) {
      const f = lerp(0.28 + ring.k * 0.11, 1, o);
      const lift = -s * 0.045 * ring.k * o;
      const c = ring.k >= 2 ? [pal.deep, pal.mid, pal.light] : [pal.mid, pal.light, pal.edge];
      for (let i = 0; i < ring.n; i++) {
        const L = ring.L * s * f * (0.88 + rnd() * 0.22);
        const W = ring.W * s * f * (0.86 + rnd() * 0.26);
        const ang = ring.rot + seed + i * TAU / ring.n + (rnd() - 0.5) * 0.24 + (1 - o) * 0.25;
        const sk = (rnd() - 0.5) * 0.24;
        const wv = [rnd(), rnd(), rnd()];
        ctx.save();
        ctx.translate(0, lift);
        ctx.rotate(ang);
        if (shadow) {
          ctx.shadowColor = "rgba(70,0,25,0.3)";
          ctx.shadowBlur = s * 0.1;
          ctx.shadowOffsetY = s * 0.025;
        } else {
          ctx.save();
          ctx.translate(0, s * 0.025);
          ctx.scale(1.04, 1.04);
          petalPath(ctx, L, W, sk, wv);
          ctx.fillStyle = "rgba(70,0,25,0.16)";
          ctx.fill();
          ctx.restore();
        }
        const g = ctx.createRadialGradient(0, 0, L * 0.04, 0, 0, L * 1.05);
        g.addColorStop(0, c[0]);
        g.addColorStop(0.55, c[1]);
        g.addColorStop(1, c[2]);
        petalPath(ctx, L, W, sk, wv);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        // ánh sáng mềm ở đầu cánh
        const sheen = ctx.createLinearGradient(0, -L, 0, -L * 0.35);
        sheen.addColorStop(0, "rgba(255,255,255,0.3)");
        sheen.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = sheen;
        ctx.fill();
        // gân cánh mờ
        if (ring.k < 2 && s >= 14) {
          ctx.globalAlpha = 0.1;
          ctx.strokeStyle = c[0];
          ctx.lineWidth = 0.6;
          for (let v = -1; v <= 1; v++) {
            ctx.beginPath();
            ctx.moveTo(0, -L * 0.12);
            ctx.quadraticCurveTo(v * W * 0.1, -L * 0.5, v * W * 0.2 + sk * W, -L * 0.82);
            ctx.stroke();
          }
        }
        // mép cánh cuộn nhẹ
        ctx.globalAlpha = ring.k < 2 ? 0.42 : 0.25;
        ctx.strokeStyle = c[2];
        ctx.lineWidth = Math.max(0.6, s * (ring.k < 2 ? 0.035 : 0.015));
        ctx.lineCap = "round";
        rimPath(ctx, L, W, sk, wv);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.restore();
      }
    }

    // lõi búp xoắn
    ctx.save();
    ctx.translate(0, -s * 0.2 * o);
    for (let k = 0; k < 3; k++) {
      ctx.save();
      ctx.rotate(seed * 2 + k * 2.1);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.2);
      g.addColorStop(0, pal.deep);
      g.addColorStop(1, pal.mid);
      ctx.fillStyle = g;
      petalPath(ctx, s * (0.2 - k * 0.03), s * (0.34 - k * 0.05), 0.1, [0.3, 0.5, 0.3]);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = pal.deep;
    ctx.lineWidth = Math.max(0.6, s * 0.018);
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.06, seed, seed + Math.PI * 1.3);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.restore();
  }

  /* ---------- Tulip (nhìn ngang, cánh khép thành chén) ---------- */
  function cupPath(ctx, w, h, sk) {
    const tx = (sk || 0) * w;
    ctx.beginPath();
    ctx.moveTo(0, h * 0.08);
    ctx.bezierCurveTo(-w * 0.66, h * 0.02, -w * 0.62 + tx * 0.5, -h * 0.6, -w * 0.2 + tx, -h * 0.95);
    ctx.quadraticCurveTo(tx, -h * 1.05, w * 0.2 + tx, -h * 0.95);
    ctx.bezierCurveTo(w * 0.62 + tx * 0.5, -h * 0.6, w * 0.66, h * 0.02, 0, h * 0.08);
    ctx.closePath();
  }
  function streaks(ctx, w, h, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 0.7;
    for (let v = -2; v <= 2; v++) {
      ctx.beginPath();
      ctx.moveTo(v * w * 0.05, h * 0.02);
      ctx.quadraticCurveTo(v * w * 0.14, -h * 0.5, v * w * 0.1, -h * 0.88);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function drawTulipHead(ctx, s, open, pal, seed, shadow) {
    const o = ease(open);
    const rnd = seeded(seed);
    const H = s * 1.35 * (0.94 + rnd() * 0.12);
    const W = s * (0.6 + 0.32 * o) * (0.92 + rnd() * 0.16);
    ctx.save();

    const dark = ctx.createLinearGradient(0, 0, 0, -H);
    dark.addColorStop(0, pal.deep);
    dark.addColorStop(1, pal.mid);
    const side = ctx.createLinearGradient(0, 0, 0, -H);
    side.addColorStop(0, pal.deep);
    side.addColorStop(0.55, pal.mid);
    side.addColorStop(1, pal.light);

    // 2 cánh sau ló ra hai bên
    if (shadow) {
      ctx.shadowColor = "rgba(70,0,25,0.28)";
      ctx.shadowBlur = s * 0.14;
      ctx.shadowOffsetY = s * 0.04;
    }
    for (const dir of [-1, 1]) {
      ctx.save();
      ctx.rotate(dir * (0.16 + 0.2 * o) + (rnd() - 0.5) * 0.08);
      ctx.fillStyle = dark;
      cupPath(ctx, W * 0.68, H * 0.95, dir * 0.12);
      ctx.fill();
      ctx.restore();
    }
    ctx.shadowColor = "transparent";
    // 2 cánh bên
    for (const dir of [-1, 1]) {
      ctx.save();
      ctx.translate(dir * W * 0.18, 0);
      ctx.rotate(dir * (0.08 + 0.3 * o) + (rnd() - 0.5) * 0.08);
      ctx.fillStyle = side;
      cupPath(ctx, W * 0.72, H * (0.9 + rnd() * 0.06), dir * 0.08);
      ctx.fill();
      streaks(ctx, W * 0.72, H * 0.9, pal.deep, 0.1);
      ctx.restore();
    }
    // cánh trước
    const sk = (rnd() - 0.5) * 0.16;
    const front = ctx.createLinearGradient(0, 0, 0, -H);
    front.addColorStop(0, pal.deep);
    front.addColorStop(0.45, pal.light);
    front.addColorStop(1, pal.edge);
    ctx.fillStyle = front;
    cupPath(ctx, W * 0.8, H, sk);
    ctx.fill();
    const sheen = ctx.createLinearGradient(-W * 0.4, 0, W * 0.4, 0);
    sheen.addColorStop(0, "rgba(255,255,255,0)");
    sheen.addColorStop(0.4, "rgba(255,255,255,0.22)");
    sheen.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = sheen;
    ctx.fill();
    streaks(ctx, W * 0.8, H, pal.deep, 0.08);
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = pal.edge;
    ctx.lineWidth = Math.max(0.6, s * 0.03);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-W * 0.16 + sk * W * 0.8, -H * 0.93);
    ctx.quadraticCurveTo(sk * W * 0.8, -H * 1.03, W * 0.16 + sk * W * 0.8, -H * 0.93);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* ---------- Cúc họa mi (nhìn chính diện) ---------- */
  function drawDaisyHead(ctx, s, open, pal, seed) {
    const o = ease(open);
    const rnd = seeded(seed);
    ctx.save();
    ctx.scale(1, 0.84);
    ctx.fillStyle = LEAF.mid;
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.3, 0, TAU);
    ctx.fill();
    const n = 20, base = s * (0.3 + 0.7 * o);
    const white = ctx.createRadialGradient(0, 0, s * 0.15, 0, 0, base * 1.1);
    white.addColorStop(0, "#e6d9de");
    white.addColorStop(0.45, "#fbf7f8");
    white.addColorStop(1, "#ffffff");
    const tint = ctx.createRadialGradient(0, 0, s * 0.15, 0, 0, base * 1.1);
    tint.addColorStop(0, "#e6d9de");
    tint.addColorStop(1, pal.edge);
    for (let i = 0; i < n; i++) {
      const len = base * (0.82 + rnd() * 0.3);
      const wid = s * (0.09 + rnd() * 0.04);
      ctx.save();
      ctx.rotate(seed + i * TAU / n + (rnd() - 0.5) * 0.18);
      ctx.fillStyle = i % 3 === 0 ? tint : white;
      ctx.beginPath();
      ctx.moveTo(s * 0.1, 0);
      ctx.quadraticCurveTo(len * 0.5, -wid * 1.3, len, -wid * 0.2);
      ctx.quadraticCurveTo(len * 1.04, wid * 0.3, len * 0.9, wid * 0.6);
      ctx.quadraticCurveTo(len * 0.5, wid * 1.2, s * 0.1, 0);
      ctx.fill();
      ctx.restore();
    }
    const g = ctx.createRadialGradient(-s * 0.06, -s * 0.06, 0, 0, 0, s * 0.27);
    g.addColorStop(0, "#fde27a");
    g.addColorStop(0.6, "#efb22a");
    g.addColorStop(1, "#c07d0e");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.26, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "rgba(140,80,0,0.35)";
    for (let i = 0; i < 14; i++) {
      const a = i * 2.4 + seed, r = s * 0.2 * Math.sqrt((i + 0.5) / 14);
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r, Math.sin(a) * r, Math.max(0.5, s * 0.022), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawHead(ctx, f, open, shadow) {
    if (f.kind === "tulip") drawTulipHead(ctx, f.size, open, f.pal, f.seed, shadow);
    else if (f.kind === "daisy") drawDaisyHead(ctx, f.size, open, f.pal, f.seed);
    else drawRoseHead(ctx, f.size, open, f.pal, f.seed, shadow);
  }

  // Lá: cong nhẹ, gấp theo gân giữa (nửa sáng nửa tối)
  function drawLeaf(ctx, x, y, angle, len, bend) {
    if (len < 2) return;
    const b = bend * len;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const g = ctx.createLinearGradient(0, -len * 0.3, 0, len * 0.3);
    g.addColorStop(0, LEAF.light);
    g.addColorStop(0.47, LEAF.mid);
    g.addColorStop(0.53, LEAF.dark);
    g.addColorStop(1, LEAF.dark);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(len * 0.3, -len * 0.38, len * 0.72, -len * 0.3 + b * 0.6, len, b);
    ctx.bezierCurveTo(len * 0.72, len * 0.26 + b * 0.6, len * 0.28, len * 0.3, 0, 0);
    ctx.fill();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = LEAF.vein;
    ctx.lineWidth = Math.max(0.5, len * 0.025);
    ctx.beginPath();
    ctx.moveTo(len * 0.04, 0);
    ctx.quadraticCurveTo(len * 0.55, b * 0.4, len * 0.94, b * 0.95);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function cPoint(t, P) {
    const u = 1 - t;
    const x = u * u * u * P[0] + 3 * u * u * t * P[2] + 3 * u * t * t * P[4] + t * t * t * P[6];
    const y = u * u * u * P[1] + 3 * u * u * t * P[3] + 3 * u * t * t * P[5] + t * t * t * P[7];
    const dx = 3 * u * u * (P[2] - P[0]) + 6 * u * t * (P[4] - P[2]) + 3 * t * t * (P[6] - P[4]);
    const dy = 3 * u * u * (P[3] - P[1]) + 6 * u * t * (P[5] - P[3]) + 3 * t * t * (P[7] - P[5]);
    return { x, y, ang: Math.atan2(dy, dx) };
  }

  function drawThorn(ctx, p, side, len) {
    const tx = Math.cos(p.ang), ty = Math.sin(p.ang);
    const nx = Math.cos(p.ang + side * Math.PI / 2), ny = Math.sin(p.ang + side * Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(p.x - tx * len * 0.5, p.y - ty * len * 0.5);
    ctx.lineTo(p.x + tx * len * 0.5, p.y + ty * len * 0.5);
    ctx.lineTo(p.x + nx * len + tx * len * 0.8, p.y + ny * len + ty * len * 0.8);
    ctx.fill();
  }

  // Thân thon dần từ gốc lên ngọn
  function drawStem(ctx, P, wBase, wTop) {
    const N = 10, left = [], right = [];
    for (let i = 0; i <= N; i++) {
      const p = cPoint(i / N, P);
      const w = lerp(wBase, wTop, i / N) / 2;
      const nx = -Math.sin(p.ang), ny = Math.cos(p.ang);
      left.push([p.x + nx * w, p.y + ny * w]);
      right.push([p.x - nx * w, p.y - ny * w]);
    }
    ctx.fillStyle = STEM;
    ctx.beginPath();
    ctx.moveTo(left[0][0], left[0][1]);
    for (let i = 1; i <= N; i++) ctx.lineTo(left[i][0], left[i][1]);
    for (let i = N; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
    ctx.closePath();
    ctx.fill();
  }

  function makeRose(x, y, size, opts) {
    opts = opts || {};
    return {
      x, y, size,
      kind: opts.kind || "rose",
      pal: opts.pal || pickPalette(),
      seed: Math.random() * TAU,
      lean: opts.lean !== undefined ? opts.lean : (Math.random() - 0.5) * 0.06,
      bow: (Math.random() - 0.5) * 0.24,
      bend: (Math.random() - 0.5) * 0.24,
      tilt: (Math.random() - 0.5) * 0.3,
      side: Math.random() < 0.5 ? -1 : 1,
      phase: Math.random() * TAU,
      delay: opts.delay || 0,
      t: opts.t !== undefined ? opts.t : 0,
      sprites: null
    };
  }

  // Vườn đông hoa: mỗi bông vẽ sẵn 12 nấc nở vào ảnh đệm, nở xong chỉ giữ ảnh cuối (có bóng mềm)
  const STAGES = 12;
  function makeSprite(f, open, shadow) {
    const half = Math.ceil(f.size * (f.kind === "tulip" ? 1.55 : 1.4));
    const c = document.createElement("canvas");
    c.width = c.height = Math.ceil(half * 2 * dpr);
    const x = c.getContext("2d");
    x.setTransform(dpr, 0, 0, dpr, half * dpr, half * dpr);
    drawHead(x, f, open, shadow);
    c.half = half;
    return c;
  }
  function spriteFor(f, open) {
    const step = open >= 1 ? STAGES : Math.floor(open * STAGES);
    if (!f.sprites) f.sprites = [];
    let sp = f.sprites[step];
    if (!sp) sp = f.sprites[step] = makeSprite(f, step / STAGES, step === STAGES);
    if (step === STAGES && f.sprites.length > 1) { f.sprites = []; f.sprites[STAGES] = sp; }
    return sp;
  }

  // t: 0 → 0.55 thân mọc, 0.4 → 0.6 nụ xuất hiện, 0.5 → 1 hoa nở
  function drawRose(ctx, f, w, h, now, opts) {
    opts = opts || {};
    const t = clamp01(f.t);
    const stemP = ease(t / 0.55);
    const headP = ease((t - 0.4) / 0.2);
    const open = clamp01((t - 0.5) / 0.5);
    const wind = windAt(f.x, now, f.phase);
    const windLag = windAt(f.x, now - 240, f.phase);

    const x0 = f.x * w, y0 = h + 4;
    const fullH = y0 - f.y * h;
    const curH = fullH * stemP;
    if (curH < 1) return;
    const x1 = x0 + (f.lean * w + wind * fullH * 0.6) * stemP;
    const y1 = y0 - curH;
    // đường cong chữ S nhẹ: gốc đứng, ngọn uốn theo gió
    const P = [
      x0, y0,
      x0 + f.bow * curH * 0.25, y0 - curH * 0.35,
      x1 - (x1 - x0) * 0.4 - f.bow * curH * 0.1, y0 - curH * 0.72,
      x1, y1
    ];

    const wStem = f.kind === "daisy" ? clamp(f.size * 0.05, 1.2, 3) : clamp(f.size * 0.07, 1.6, 4.5);
    drawStem(ctx, P, wStem * 1.35, wStem * 0.75);

    if (f.kind === "rose" && f.size >= 45) {
      ctx.fillStyle = STEM;
      [0.22, 0.5, 0.74].forEach((at, i) => {
        if (stemP > at + 0.1) drawThorn(ctx, cPoint(at, P), i % 2 ? 1 : -1, f.size * 0.08);
      });
    }

    const leafP = ease((stemP - 0.45) / 0.55);
    if (leafP > 0) {
      // hồng: 2 lá ngang thân · tulip: 2 lá dài ôm thân từ gốc · cúc: 1 lá nhỏ
      let leaves;
      if (f.kind === "tulip") {
        leaves = [{ at: 0.12, side: f.side, spread: 0.32, len: 2.0 }, { at: 0.28, side: -f.side, spread: 0.36, len: 1.7 }];
      } else if (f.kind === "daisy") {
        leaves = [{ at: 0.35, side: f.side, spread: 0.8, len: 0.7 }];
      } else {
        leaves = [{ at: 0.42, side: f.side, spread: 0.9, len: 0.85 }];
        if (f.size >= 30) leaves.push({ at: 0.66, side: -f.side, spread: 0.9, len: 0.85 });
      }
      leaves.forEach(l => {
        const p = cPoint(l.at, P);
        const flutter = reduceMotion ? 0 : Math.sin(now / 600 + f.phase + l.at * 4) * 0.05 + windLag * 1.2 * l.side;
        drawLeaf(ctx, p.x, p.y, p.ang + l.side * l.spread + flutter, f.size * l.len * leafP, f.bend * l.side);
      });
    }

    if (headP > 0) {
      const breathe = reduceMotion ? 1 : 1 + Math.sin(now / 1300 + f.phase) * (opts.breathe ? 0.025 : 0.012);
      ctx.save();
      ctx.translate(x1, y1);
      ctx.rotate(windLag * 1.1 + f.tilt * (f.kind === "tulip" ? 0.5 : 1));
      ctx.scale(headP * breathe, headP * breathe);
      if (opts.cache) {
        const sp = spriteFor(f, open);
        ctx.drawImage(sp, -sp.half, -sp.half, sp.half * 2, sp.half * 2);
      } else {
        drawHead(ctx, f, open, opts.shadow);
      }
      ctx.restore();
    }
  }

  /* ---------- Lấp lánh ---------- */
  function makeSparkles(n, x0, x1, y0, y1) {
    const list = [];
    for (let i = 0; i < n; i++) {
      list.push({
        x: lerp(x0, x1, Math.random()), y: lerp(y0, y1, Math.random()),
        r: 3 + Math.random() * 4, ph: Math.random() * TAU, sp: 0.6 + Math.random() * 0.8
      });
    }
    return list;
  }
  function drawSparkles(ctx, list, w, h, now) {
    if (reduceMotion) return;
    ctx.fillStyle = gold;
    for (const s of list) {
      const a = Math.pow(Math.max(0, Math.sin(now / 600 * s.sp + s.ph)), 3);
      if (a < 0.02) continue;
      const x = s.x * w, y = s.y * h, r = s.r * (0.6 + a * 0.6);
      ctx.globalAlpha = a * 0.9;
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.quadraticCurveTo(x, y, x, y + r);
      ctx.quadraticCurveTo(x, y, x - r, y);
      ctx.quadraticCurveTo(x, y, x, y - r);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- Màn 1: bông hồng ---------- */
  const introCanvas = document.getElementById("introFlower");
  const ictx = introCanvas.getContext("2d");
  let isz = fit(introCanvas, ictx);
  const hero = makeRose(0.5, 0.3, 0, { pal: PALETTES[0], lean: 0.03, t: reduceMotion ? 1 : 0 });
  hero.tilt = -0.05;
  hero.side = -1;
  hero.bow = 0.1;
  hero.bend = 0.12;
  const sizeHero = () => { hero.size = isz.w * 0.3; };
  sizeHero();
  const introSparkles = makeSparkles(10, 0.08, 0.92, 0.04, 0.6);
  const introStart = performance.now() + 250;
  const introHint = document.getElementById("introHint");
  setTimeout(() => introHint.classList.add("ready"), reduceMotion ? 0 : 2400);

  /* ---------- Màn 2: vườn hồng ---------- */
  const gardenCanvas = document.getElementById("garden");
  const gctx = gardenCanvas.getContext("2d");
  let gsz = fit(gardenCanvas, gctx);
  let flowers = [];
  let gardenStart = null;
  const HAZE_STEPS = [0.42, 0.5, 0.58, 0.66, 0.74, 0.82, 0.9];
  const gardenSparkles = makeSparkles(24, 0.02, 0.98, 0.3, 0.95);

  function plantGarden(cx, cy) {
    flowers = [];
    // Chia vườn thành các dải theo chiều sâu để mật độ đều, nhưng mỗi bông đặt ngẫu nhiên
    // trong ô của nó (không thẳng hàng/cột): sau nhỏ cao, trước to thấp, vườn hơi nhô ở giữa,
    // mép trên lô nhô vài bông cao vượt lên cho tự nhiên
    const portrait = gsz.h > gsz.w;
    const rows = portrait ? 10 : 8;
    const sFront = clamp(gsz.w * 0.075, 22, 62);
    const sBack = sFront * 0.42;
    const yTop = 0.34, yBot = 0.97;
    const depthToY = d => yTop + (yBot - yTop) * Math.pow(d, 1.15);
    for (let r = 0; r < rows; r++) {
      const d0 = r / rows, d1 = (r + 1) / rows;
      const gap = lerp(sBack, sFront, (d0 + d1) / 2) * 1.35;
      const count = Math.ceil((gsz.w * 1.06) / gap);
      for (let i = 0; i < count; i++) {
        if (r === 0 && Math.random() < 0.18) continue;
        const x = (-0.03 * gsz.w + (i + Math.random()) * gap) / gsz.w;
        const d = lerp(d0, d1, Math.random());
        const mound = 0.03 * (1 - Math.pow(2 * clamp01(x) - 1, 2)) * (1 - d * 0.6);
        let y = depthToY(d) - mound;
        if (r <= 1 && Math.random() < 0.12) y -= 0.03 + Math.random() * 0.04;
        // ~55% hồng, ~30% tulip, ~15% cúc họa mi
        const roll = Math.random();
        const kind = roll < 0.55 ? "rose" : roll < 0.85 ? "tulip" : "daisy";
        const scale = kind === "tulip" ? 0.8 : kind === "daisy" ? 0.75 : 1;
        const size = lerp(sBack, sFront, d) * (0.82 + Math.random() * 0.36) * scale;
        const dist = Math.hypot(x - cx, y - cy);
        flowers.push(makeRose(x, y, size, { kind, delay: dist * 1.5 + Math.random() * 0.3, t: reduceMotion ? 1 : 0 }));
      }
    }
    flowers.sort((a, b) => a.y - b.y);
  }

  /* ---------- Cánh hồng rơi ---------- */
  const petalCanvas = document.getElementById("petals");
  const pctx = petalCanvas.getContext("2d");
  let psz = fit(petalCanvas, pctx);
  const petals = [];
  let petalsOn = false;

  function newPetal(fromTop, x, y) {
    return {
      x: x !== undefined ? x : Math.random() * psz.w,
      y: y !== undefined ? y : (fromTop ? -20 : Math.random() * psz.h),
      r: 7 + Math.random() * 7,
      vy: 0.4 + Math.random() * 0.6,
      vx: (Math.random() - 0.5) * 0.4,
      rot: Math.random() * TAU,
      vr: (Math.random() - 0.5) * 0.04,
      flip: Math.random() * TAU,
      vf: 0.03 + Math.random() * 0.05,
      ph: Math.random() * TAU,
      pal: pickPalette()
    };
  }
  function burstAt(x, y, count) {
    if (reduceMotion) return;
    for (let i = 0; i < count; i++) {
      const p = newPetal(false, x, y);
      const a = Math.random() * TAU, sp = 1.5 + Math.random() * 3.5;
      p.vx = Math.cos(a) * sp;
      p.vy = Math.sin(a) * sp - 1.5;
      petals.push(p);
    }
  }
  function drawPetals(now) {
    pctx.clearRect(0, 0, psz.w, psz.h);
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];
      p.vy = Math.min(p.vy + 0.03, 1.2);
      p.y += p.vy;
      p.x += p.vx + Math.sin(now / 900 + p.ph) * 0.45;
      p.vx *= 0.985;
      p.rot += p.vr;
      p.flip += p.vf;
      if (p.y > psz.h + 30) {
        if (petals.length > 22 || !petalsOn) { petals.splice(i, 1); continue; }
        petals[i] = newPetal(true);
        continue;
      }
      const r = p.r;
      pctx.save();
      pctx.translate(p.x, p.y);
      pctx.rotate(p.rot);
      pctx.scale(Math.max(0.15, Math.abs(Math.cos(p.flip))), 1);
      const g = pctx.createLinearGradient(0, r, 0, -r);
      g.addColorStop(0, p.pal.mid);
      g.addColorStop(1, p.pal.edge);
      pctx.fillStyle = g;
      pctx.globalAlpha = 0.9;
      pctx.beginPath();
      pctx.moveTo(0, r);
      pctx.bezierCurveTo(-r * 1.1, r * 0.2, -r * 0.7, -r, 0, -r * 0.75);
      pctx.bezierCurveTo(r * 0.7, -r, r * 1.1, r * 0.2, 0, r);
      pctx.fill();
      pctx.restore();
    }
  }

  /* ---------- Màn 3: thiệp ---------- */
  const cardCanvas = document.getElementById("cardRose");
  const cctx = cardCanvas.getContext("2d");
  let csz = { w: 0, h: 0 };
  let cardStart = null;
  const cardRose = { pal: PALETTES[0], seed: 0.4 };

  /* ---------- Chuyển màn ---------- */
  const introScreen = document.getElementById("introScreen");
  const caption = document.getElementById("gardenCaption");
  const cardScreen = document.getElementById("cardScreen");
  const flowerBtn = document.getElementById("flowerBtn");
  let opened = false;

  flowerBtn.addEventListener("click", function (e) {
    if (opened) return;
    opened = true;
    const rect = flowerBtn.getBoundingClientRect();
    const hx = rect.left + rect.width * 0.5, hy = rect.top + rect.height * 0.3;
    burstAt(hx, hy, 30);
    let cx = 0.5, cy = 0.6;
    if (e.clientX || e.clientY) { cx = e.clientX / gsz.w; cy = e.clientY / gsz.h; }
    plantGarden(cx, cy);
    gardenStart = performance.now();
    introScreen.classList.add("out");
    gardenCanvas.classList.add("on");
    setTimeout(() => caption.classList.add("on"), 500);
    if (!reduceMotion) {
      petalsOn = true;
      for (let i = 0; i < 16; i++) petals.push(newPetal(true, undefined, -Math.random() * psz.h));
    }
    setTimeout(showCard, CONFIG.thoiGianVuonHoa);
  });

  function showCard() {
    caption.classList.remove("on");
    cardScreen.classList.add("on");
    cardScreen.setAttribute("aria-hidden", "false");
    introScreen.hidden = true;
    csz = fit(cardCanvas, cctx);
    cardStart = performance.now() + 300;
    document.getElementById("giftBtn").focus({ preventScroll: true });
  }

  const giftBtn = document.getElementById("giftBtn");
  const toast = document.getElementById("toast");
  giftBtn.addEventListener("click", function () {
    const r = giftBtn.getBoundingClientRect();
    burstAt(r.left + r.width / 2, r.top + r.height / 2, 34);
    giftBtn.disabled = true;
    toast.hidden = false;
    notifyGift();
  });

  // Gửi mail báo "đã nhận quà" — lỗi mạng thì bỏ qua, không ảnh hưởng thiệp
  function notifyGift() {
    const payload = {
      _subject: "Thiệp 20.10: " + CONFIG.guiDen + " vừa bấm nhận quà",
      _template: "table",
      _captcha: "false",
      thong_bao: "Người nhận vừa bấm nút \"Bấm vào đây để nhận quà\". Món quà đang được chờ trong 30s.",
      gui_den: CONFIG.guiDen,
      thoi_gian: new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" }),
      trang: location.href
    };
    try {
      if (CONFIG.appsScriptUrl) {
        fetch(CONFIG.appsScriptUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        }).catch(() => {});
      } else if (CONFIG.emailNhanThongBao) {
        fetch("https://formsubmit.co/ajax/" + encodeURIComponent(CONFIG.emailNhanThongBao), {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload)
        }).catch(() => {});
      }
    } catch (e) { /* bỏ qua */ }
  }

  // Đóng thiệp để ngắm vườn, mở lại bằng nút góc trên
  const closeBtn = document.getElementById("closeBtn");
  const reopenBtn = document.getElementById("reopenBtn");
  closeBtn.addEventListener("click", function () {
    cardScreen.classList.remove("on");
    cardScreen.setAttribute("aria-hidden", "true");
    reopenBtn.hidden = false;
    reopenBtn.focus({ preventScroll: true });
  });
  reopenBtn.addEventListener("click", function () {
    reopenBtn.hidden = true;
    cardScreen.classList.add("on");
    cardScreen.setAttribute("aria-hidden", "false");
    cardStart = performance.now() + 300;
    closeBtn.focus({ preventScroll: true });
  });

  /* ---------- Vòng lặp ---------- */
  window.addEventListener("resize", function () {
    if (!introScreen.hidden) { isz = fit(introCanvas, ictx); sizeHero(); }
    gsz = fit(gardenCanvas, gctx);
    psz = fit(petalCanvas, pctx);
    if (cardStart !== null) csz = fit(cardCanvas, cctx);
  });

  (function loop(now) {
    if (!introScreen.hidden) {
      if (!reduceMotion) hero.t = clamp01((now - introStart) / 2600);
      ictx.clearRect(0, 0, isz.w, isz.h);
      drawRose(ictx, hero, isz.w, isz.h, now, { shadow: true, breathe: hero.t >= 1 });
      if (hero.t >= 1) drawSparkles(ictx, introSparkles, isz.w, isz.h, now);
    }
    if (gardenStart !== null) {
      const elapsed = (now - gardenStart) / 1000;
      for (const f of flowers) {
        if (f.t < 1) f.t = clamp01((elapsed - f.delay) / 1.6);
      }
      gctx.clearRect(0, 0, gsz.w, gsz.h);
      // phủ một lớp sương mỏng sau mỗi dải: hoa càng xa càng nhạt, tạo chiều sâu mềm
      let haze = 0;
      for (const f of flowers) {
        while (haze < HAZE_STEPS.length && f.y > HAZE_STEPS[haze]) {
          gctx.globalAlpha = 0.055;
          gctx.fillStyle = bgColor;
          gctx.fillRect(0, 0, gsz.w, gsz.h);
          gctx.globalAlpha = 1;
          haze++;
        }
        drawRose(gctx, f, gsz.w, gsz.h, now, { cache: true });
      }
      drawSparkles(gctx, gardenSparkles, gsz.w, gsz.h, now);
    }
    if (cardStart !== null && csz.w) {
      const open = reduceMotion ? 1 : clamp01((now - cardStart) / 2200);
      cctx.clearRect(0, 0, csz.w, csz.h);
      cctx.save();
      cctx.translate(csz.w / 2, csz.h / 2 + 4);
      cctx.rotate(reduceMotion ? 0 : Math.sin(now / 2400) * 0.08);
      drawRoseHead(cctx, csz.w * 0.36, Math.max(0.05, open), cardRose.pal, cardRose.seed, true);
      cctx.restore();
    }
    if (petalsOn || petals.length) drawPetals(now);
    requestAnimationFrame(loop);
  })(performance.now());
})();
</script>
</body>
</html>
