<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp 20 tháng 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Be+Vietnam+Pro:wght@400;500;600&family=Great+Vibes&display=swap">
<style>
/* Layout: 3 màn nối tiếp — 1 bông hồng nở giữa màn → vườn hồng phủ kín màn hình → thiệp một cột chỉ có lời chúc, nổi trên vườn */
:root {
  --bg: #fbeeea;
  --paper: #fff8f5;
  --ink: #4a1027;
  --ink-soft: #7d4a5c;
  --rose: #c2365f;
  --gold: #a87a2a;
  --line: #ecd3d0;
  --font-display: "Cormorant Garamond", "Times New Roman", serif;
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-script: "Great Vibes", "Brush Script MT", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e0c15;
    --paper: #2a1320;
    --ink: #fbe3ea;
    --ink-soft: #c99aab;
    --rose: #f2789b;
    --gold: #d9b064;
    --line: #4a2737;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e0c15;
  --paper: #2a1320;
  --ink: #fbe3ea;
  --ink-soft: #c99aab;
  --rose: #f2789b;
  --gold: #d9b064;
  --line: #4a2737;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.65;
  overflow-x: hidden;
}
[hidden] { display: none !important; }

canvas.layer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
#garden { z-index: 0; opacity: 0; transition: opacity 0.6s ease; }
#garden.on { opacity: 1; }
#petals { z-index: 3; }

.screen {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  padding-inline: 16px;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  transition: opacity 0.6s ease;
}
.screen.out { opacity: 0; pointer-events: none; }

/* Màn 1: một bông hồng */
.intro-inner {
  display: grid;
  justify-items: center;
  gap: 6px;
  text-align: center;
}
.flower-btn {
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  border-radius: 16px;
  width: min(72vw, 300px);
  aspect-ratio: 5 / 7;
  max-width: 100%;
  transition: transform 0.4s ease;
}
.flower-btn:hover { transform: scale(1.04); }
.flower-btn canvas { display: block; width: 100%; height: 100%; }
.flower-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; }
.intro-eyebrow {
  margin: 0;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
}
.intro-hint {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(1.4rem, 4vw, 1.8rem);
  color: var(--rose);
  opacity: 0;
  transition: opacity 0.8s ease;
}
.intro-hint.ready { opacity: 1; animation: breathe 2.4s ease-in-out 0.8s infinite; }
@keyframes breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}

/* Màn 2: vườn hồng */
.garden-caption {
  position: fixed;
  top: calc(14vh + env(safe-area-inset-top, 0px));
  left: 16px;
  right: 16px;
  z-index: 2;
  margin: 0;
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(1.8rem, 5vw, 3rem);
  color: var(--ink);
  text-wrap: balance;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.8s ease, transform 0.8s ease;
  pointer-events: none;
}
.garden-caption.on { opacity: 1; transform: none; }

/* Màn 3: thiệp */
#cardScreen {
  background: color-mix(in srgb, var(--bg) 50%, transparent);
  opacity: 0;
  pointer-events: none;
}
#cardScreen.on { opacity: 1; pointer-events: auto; }
.card {
  width: 100%;
  max-width: 560px;
  background: var(--paper);
  border: 1px solid var(--line);
  outline: 1px solid var(--line);
  outline-offset: -12px;
  border-radius: 4px;
  box-shadow: 0 30px 70px -34px color-mix(in srgb, var(--ink) 50%, transparent);
  padding: clamp(28px, 6vw, 52px) clamp(24px, 6vw, 56px) clamp(32px, 6vw, 52px);
  display: grid;
  justify-items: center;
  gap: 14px;
  text-align: center;
  transform: translateY(28px) scale(0.98);
  transition: transform 0.9s cubic-bezier(.2,.8,.2,1);
}
#cardScreen.on .card { transform: none; }
.card-rose { width: 120px; height: 120px; max-width: 100%; display: block; margin-top: -8px; }
.to {
  font-size: 0.76rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-soft);
  margin: 0;
}
.to strong { color: var(--rose); font-weight: 600; letter-spacing: 0.08em; }
h1 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.9rem, 5vw, 2.6rem);
  line-height: 1.12;
  margin: 0;
  text-wrap: balance;
}
h1 em { color: var(--rose); }
.wish {
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(1.15rem, 2.6vw, 1.4rem);
  line-height: 1.5;
  max-width: 36ch;
  margin: 0;
  text-wrap: pretty;
}
.sign {
  font-family: var(--font-script);
  font-size: clamp(1.9rem, 4vw, 2.4rem);
  color: var(--gold);
  line-height: 1.2;
  margin: 0;
  padding-inline: 8px;
}
.gift-btn {
  margin-top: 8px;
  font: 600 1rem/1.2 var(--font-body);
  padding: 15px 28px;
  border-radius: 999px;
  border: 0;
  background: var(--rose);
  color: var(--paper);
  cursor: pointer;
  box-shadow: 0 12px 26px -14px var(--rose);
  transition: transform 0.15s ease, opacity 0.3s ease;
}
.gift-btn:hover:not(:disabled) { transform: translateY(-2px); }
.gift-btn:active:not(:disabled) { transform: scale(0.97); }
.gift-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.gift-btn:disabled { opacity: 0.55; cursor: default; }

/* hiện lần lượt từng dòng của thiệp */
.reveal { opacity: 0; transform: translateY(10px); }
#cardScreen.on .reveal {
  animation: rise 0.7s ease forwards;
  animation-delay: calc(var(--i) * 140ms + 350ms);
}
@keyframes rise { to { opacity: 1; transform: none; } }
.sign.reveal { opacity: 1; transform: none; clip-path: inset(0 100% 0 0); }
#cardScreen.on .sign.reveal { animation: write 1.8s ease forwards; animation-delay: 1.1s; }
@keyframes write { to { clip-path: inset(0 0 0 0); } }

/* Thông báo nhỏ */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  z-index: 4;
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px 9px 12px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--paper);
  font-size: 0.86rem;
  line-height: 1.35;
  box-shadow: 0 10px 28px -12px color-mix(in srgb, var(--ink) 70%, transparent);
  animation: toastIn 0.5s cubic-bezier(.2,.8,.2,1) both;
}
.toast svg { flex: none; width: 16px; height: 16px; fill: var(--rose); animation: beat 1.2s ease-in-out infinite; }
@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 16px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
@keyframes beat {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.25); }
  60% { transform: scale(0.95); }
}

@media (prefers-reduced-motion: reduce) {
  .intro-hint.ready, .toast, .toast svg { animation: none; }
  .reveal, .sign.reveal { opacity: 1; transform: none; clip-path: none; }
  #cardScreen.on .reveal, #cardScreen.on .sign.reveal { animation: none; }
  .screen, #garden, .garden-caption, .card, .flower-btn { transition-duration: 0.01s; }
}
</style>
</head>
<body>

<canvas id="garden" class="layer" aria-hidden="true"></canvas>
<canvas id="petals" class="layer" aria-hidden="true"></canvas>

<!-- Màn 1 -->
<section class="screen" id="introScreen">
  <div class="intro-inner">
    <p class="intro-eyebrow">20 · 10 · 2026</p>
    <button class="flower-btn" id="flowerBtn" type="button" aria-label="Chạm vào bông hồng để mở thiệp">
      <canvas id="introFlower"></canvas>
    </button>
    <p class="intro-hint" id="introHint">Chạm vào bông hồng</p>
  </div>
</section>

<!-- Màn 2 -->
<p class="garden-caption" id="gardenCaption">Tặng cả một vườn hồng</p>

<!-- Màn 3 -->
<section class="screen" id="cardScreen" aria-hidden="true">
  <article class="card">
    <canvas class="card-rose reveal" id="cardRose" style="--i:0" aria-hidden="true"></canvas>
    <p class="to reveal" style="--i:1">Gửi đến <strong id="toName"></strong></p>
    <h1 class="reveal" style="--i:2">Chúc mừng ngày <em>Phụ nữ Việt Nam</em> 20 tháng 10</h1>
    <p class="wish reveal" id="wish" style="--i:3"></p>
    <p class="sign reveal" id="signName"></p>
    <button class="gift-btn reveal" id="giftBtn" type="button" style="--i:6">Bấm vào đây để nhận quà</button>
  </article>
</section>

<div class="toast" id="toast" role="status" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.1C.9 8.6 2.9 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.8 0 5.8 4.1 4.3 7.4C19.5 16.4 12 21 12 21z"/></svg>
  <span>Món quà đang được gửi đến bạn, chờ trong 30s nhé &lt;3</span>
</div>

<script>
/* ====== SỬA NỘI DUNG THIỆP Ở ĐÂY ====== */
var CONFIG = {
  guiDen: "Các chị em GTV SEO",
  kyTen: "Cánh mày râu GTV",
  loiChuc: "Chúc chị em luôn rạng rỡ, khỏe mạnh và được yêu thương mỗi ngày, không chỉ riêng hôm nay. Cảm ơn chị em đã giữ cho từng dự án chạy đúng nhịp và văn phòng luôn có tiếng cười.",
  thoiGianVuonHoa: 4000 // mili-giây hiển thị vườn hồng trước khi hiện thiệp (3000–5000)
};
/* ====================================== */

(function () {
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const clamp01 = v => Math.min(1, Math.max(0, v));
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => 1 - Math.pow(1 - clamp01(t), 3);

  document.getElementById("toName").textContent = CONFIG.guiDen;
  document.getElementById("signName").textContent = CONFIG.kyTen;
  document.getElementById("wish").textContent = CONFIG.loiChuc;

  // Màu hoa: đỏ nhung, hồng, hồng phấn
  const PALETTES = [
    { deep: "#6e0b26", mid: "#b81e48", light: "#e44d73", edge: "#ff9db4" },
    { deep: "#9c2a4a", mid: "#dc5f84", light: "#f496b0", edge: "#ffd2de" },
    { deep: "#b0526a", mid: "#ec9bb0", light: "#f8cad6", edge: "#fff1f4" }
  ];
  const LEAF = { dark: "#2c5530", mid: "#5b8a4c", vein: "#9cc287" };
  const STEM = "#4a7340";

  let gold = "#a87a2a";
  function readTokens() {
    gold = getComputedStyle(document.documentElement).getPropertyValue("--gold").trim() || gold;
  }
  readTokens();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTokens);
  new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function fit(canvas, ctx) {
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w: r.width, h: r.height };
  }

  /* ---------- Vẽ hoa hồng ---------- */
  function petalPath(ctx, L, W) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-W * 0.62, -L * 0.12, -W * 0.66, -L * 0.72, -W * 0.34, -L * 0.94);
    ctx.quadraticCurveTo(-W * 0.16, -L * 1.07, 0, -L * 0.97);
    ctx.quadraticCurveTo(W * 0.16, -L * 1.07, W * 0.34, -L * 0.94);
    ctx.bezierCurveTo(W * 0.66, -L * 0.72, W * 0.62, -L * 0.12, 0, 0);
    ctx.closePath();
  }
  function rimPath(ctx, L, W) {
    ctx.beginPath();
    ctx.moveTo(-W * 0.4, -L * 0.88);
    ctx.quadraticCurveTo(-W * 0.16, -L * 1.06, 0, -L * 0.96);
    ctx.quadraticCurveTo(W * 0.16, -L * 1.06, W * 0.4, -L * 0.88);
  }

  // 5 vòng cánh, ngoài to sáng → trong nhỏ đậm
  const RINGS = [
    { n: 5, L: 1.0, W: 1.12, rot: 0.0, k: 0 },
    { n: 5, L: 0.82, W: 0.98, rot: 0.63, k: 1 },
    { n: 4, L: 0.64, W: 0.84, rot: 0.25, k: 2 },
    { n: 4, L: 0.48, W: 0.72, rot: 1.05, k: 3 },
    { n: 3, L: 0.34, W: 0.6, rot: 0.45, k: 4 }
  ];

  function drawRoseHead(ctx, s, open, pal, seed, shadow) {
    const o = ease(open);
    ctx.save();
    ctx.scale(1, 0.84);

    // đài hoa
    const sl = s * (0.42 + 0.32 * (1 - o));
    ctx.fillStyle = LEAF.dark;
    for (let i = 0; i < 5; i++) {
      ctx.save();
      ctx.rotate(seed * 0.7 + i * TAU / 5 + 0.3);
      ctx.beginPath();
      ctx.moveTo(-s * 0.1, 0);
      ctx.quadraticCurveTo(-s * 0.07, -sl * 0.7, 0, -sl);
      ctx.quadraticCurveTo(s * 0.07, -sl * 0.7, s * 0.1, 0);
      ctx.fill();
      ctx.restore();
    }

    for (const ring of RINGS) {
      const f = lerp(0.28 + ring.k * 0.11, 1, o);
      const L = ring.L * s * f;
      const W = ring.W * s * f;
      const c = ring.k >= 2 ? [pal.deep, pal.mid, pal.light] : [pal.mid, pal.light, pal.edge];
      for (let i = 0; i < ring.n; i++) {
        ctx.save();
        ctx.rotate(ring.rot + seed + i * TAU / ring.n + (1 - o) * 0.25);
        if (shadow) {
          ctx.shadowColor = "rgba(70,0,25,0.35)";
          ctx.shadowBlur = s * 0.12;
          ctx.shadowOffsetY = s * 0.03;
        } else {
          ctx.save();
          ctx.translate(0, s * 0.03);
          ctx.scale(1.04, 1.04);
          petalPath(ctx, L, W);
          ctx.fillStyle = "rgba(70,0,25,0.22)";
          ctx.fill();
          ctx.restore();
        }
        const g = ctx.createRadialGradient(0, 0, L * 0.04, 0, 0, L * 1.05);
        g.addColorStop(0, c[0]);
        g.addColorStop(0.58, c[1]);
        g.addColorStop(1, c[2]);
        petalPath(ctx, L, W);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        // mép cánh cuộn ra ngoài
        ctx.globalAlpha = ring.k < 2 ? 0.75 : 0.4;
        ctx.strokeStyle = c[2];
        ctx.lineWidth = Math.max(0.6, s * (ring.k < 2 ? 0.05 : 0.018));
        ctx.lineCap = "round";
        rimPath(ctx, L, W);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.restore();
      }
    }

    // nhụy xoắn
    ctx.fillStyle = pal.deep;
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.1, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = pal.mid;
    ctx.lineWidth = Math.max(0.6, s * 0.022);
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.025 * (k + 1.2), seed + k * 1.9, seed + k * 1.9 + Math.PI * 1.25);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawLeaf(ctx, x, y, angle, len) {
    if (len < 2) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const g = ctx.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, LEAF.dark);
    g.addColorStop(1, LEAF.mid);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(len * 0.25, -len * 0.42, len * 0.75, -len * 0.36, len, 0);
    ctx.bezierCurveTo(len * 0.75, len * 0.32, len * 0.25, len * 0.36, 0, 0);
    ctx.fill();
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = LEAF.vein;
    ctx.lineWidth = Math.max(0.6, len * 0.03);
    ctx.beginPath();
    ctx.moveTo(len * 0.05, 0);
    ctx.quadraticCurveTo(len * 0.5, -len * 0.04, len * 0.92, 0);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function qPoint(t, x0, y0, cx, cy, x1, y1) {
    const u = 1 - t;
    return {
      x: u * u * x0 + 2 * u * t * cx + t * t * x1,
      y: u * u * y0 + 2 * u * t * cy + t * t * y1,
      ang: Math.atan2(2 * u * (cy - y0) + 2 * t * (y1 - cy), 2 * u * (cx - x0) + 2 * t * (x1 - cx))
    };
  }

  function drawThorn(ctx, p, side, len) {
    const tx = Math.cos(p.ang), ty = Math.sin(p.ang);
    const nx = Math.cos(p.ang + side * Math.PI / 2), ny = Math.sin(p.ang + side * Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(p.x - tx * len * 0.5, p.y - ty * len * 0.5);
    ctx.lineTo(p.x + tx * len * 0.5, p.y + ty * len * 0.5);
    ctx.lineTo(p.x + nx * len + tx * len * 0.8, p.y + ny * len + ty * len * 0.8);
    ctx.fill();
  }

  function makeRose(x, y, size, opts) {
    opts = opts || {};
    return {
      x, y, size,
      pal: opts.pal || PALETTES[Math.floor(Math.random() * PALETTES.length)],
      seed: Math.random() * TAU,
      lean: opts.lean !== undefined ? opts.lean : (Math.random() - 0.5) * 0.06,
      tilt: (Math.random() - 0.5) * 0.3,
      side: Math.random() < 0.5 ? -1 : 1,
      phase: Math.random() * TAU,
      delay: opts.delay || 0,
      t: opts.t !== undefined ? opts.t : 0,
      sprite: null
    };
  }

  function makeSprite(f) {
    const half = Math.ceil(f.size * 1.3);
    const c = document.createElement("canvas");
    c.width = c.height = Math.ceil(half * 2 * dpr);
    const x = c.getContext("2d");
    x.setTransform(dpr, 0, 0, dpr, half * dpr, half * dpr);
    drawRoseHead(x, f.size, 1, f.pal, f.seed, false);
    c.half = half;
    return c;
  }

  // t: 0 → 0.55 thân mọc, 0.4 → 0.6 nụ xuất hiện, 0.5 → 1 hoa nở
  function drawRose(ctx, f, w, h, now, opts) {
    opts = opts || {};
    const t = clamp01(f.t);
    const stemP = ease(t / 0.55);
    const headP = ease((t - 0.4) / 0.2);
    const open = clamp01((t - 0.5) / 0.5);
    const wind = reduceMotion ? 0 : Math.sin(now / 1700 + f.x * 5) * 0.05 + Math.sin(now / 650 + f.phase) * 0.012;

    const x0 = f.x * w, y0 = h + 4;
    const fullH = y0 - f.y * h;
    const curH = fullH * stemP;
    if (curH < 1) return;
    const x1 = x0 + (f.lean * w + wind * fullH) * stemP;
    const y1 = y0 - curH;
    const cx = x0 + (x1 - x0) * 0.15, cy = y0 - curH * 0.5;

    ctx.strokeStyle = STEM;
    ctx.lineWidth = clamp(f.size * 0.07, 1.6, 4.5);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(cx, cy, x1, y1);
    ctx.stroke();

    if (f.size >= 45) {
      ctx.fillStyle = STEM;
      [0.22, 0.5, 0.74].forEach((at, i) => {
        if (stemP > at + 0.1) drawThorn(ctx, qPoint(at, x0, y0, cx, cy, x1, y1), i % 2 ? 1 : -1, f.size * 0.09);
      });
    }

    const leafP = ease((stemP - 0.45) / 0.55);
    if (leafP > 0) {
      const leaves = [{ at: 0.42, side: f.side }];
      if (f.size >= 30) leaves.push({ at: 0.66, side: -f.side });
      leaves.forEach(l => {
        const p = qPoint(l.at, x0, y0, cx, cy, x1, y1);
        const flutter = reduceMotion ? 0 : Math.sin(now / 500 + f.phase + l.at * 4) * 0.06;
        drawLeaf(ctx, p.x, p.y, p.ang + l.side * 0.9 + flutter, f.size * 0.85 * leafP);
      });
    }

    if (headP > 0) {
      const breathe = opts.breathe && !reduceMotion ? 1 + Math.sin(now / 900) * 0.025 : 1;
      ctx.save();
      ctx.translate(x1, y1);
      ctx.rotate(wind * 0.8 + f.tilt);
      ctx.scale(headP * breathe, headP * breathe);
      if (open >= 1 && opts.cache) {
        if (!f.sprite) f.sprite = makeSprite(f);
        ctx.drawImage(f.sprite, -f.sprite.half, -f.sprite.half, f.sprite.half * 2, f.sprite.half * 2);
      } else {
        drawRoseHead(ctx, f.size, open, f.pal, f.seed, opts.shadow);
      }
      ctx.restore();
    }
  }

  /* ---------- Lấp lánh ---------- */
  function makeSparkles(n, x0, x1, y0, y1) {
    const list = [];
    for (let i = 0; i < n; i++) {
      list.push({
        x: lerp(x0, x1, Math.random()), y: lerp(y0, y1, Math.random()),
        r: 3 + Math.random() * 4, ph: Math.random() * TAU, sp: 0.6 + Math.random() * 0.8
      });
    }
    return list;
  }
  function drawSparkles(ctx, list, w, h, now) {
    if (reduceMotion) return;
    ctx.fillStyle = gold;
    for (const s of list) {
      const a = Math.pow(Math.max(0, Math.sin(now / 600 * s.sp + s.ph)), 3);
      if (a < 0.02) continue;
      const x = s.x * w, y = s.y * h, r = s.r * (0.6 + a * 0.6);
      ctx.globalAlpha = a * 0.9;
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.quadraticCurveTo(x, y, x, y + r);
      ctx.quadraticCurveTo(x, y, x - r, y);
      ctx.quadraticCurveTo(x, y, x, y - r);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- Màn 1: bông hồng ---------- */
  const introCanvas = document.getElementById("introFlower");
  const ictx = introCanvas.getContext("2d");
  let isz = fit(introCanvas, ictx);
  const hero = makeRose(0.5, 0.3, 0, { pal: PALETTES[0], lean: 0.03, t: reduceMotion ? 1 : 0 });
  hero.tilt = -0.05;
  hero.side = -1;
  const sizeHero = () => { hero.size = isz.w * 0.3; };
  sizeHero();
  const introSparkles = makeSparkles(10, 0.08, 0.92, 0.04, 0.6);
  const introStart = performance.now() + 250;
  const introHint = document.getElementById("introHint");
  setTimeout(() => introHint.classList.add("ready"), reduceMotion ? 0 : 2400);

  /* ---------- Màn 2: vườn hồng ---------- */
  const gardenCanvas = document.getElementById("garden");
  const gctx = gardenCanvas.getContext("2d");
  let gsz = fit(gardenCanvas, gctx);
  let flowers = [];
  let gardenStart = null;
  const gardenSparkles = makeSparkles(24, 0.02, 0.98, 0.3, 0.95);

  function plantGarden(cx, cy) {
    flowers = [];
    const n = clamp(Math.round(gsz.w / 30), 22, 55);
    const unit = Math.min(gsz.w, gsz.h);
    for (let i = 0; i < n; i++) {
      const x = 0.02 + Math.random() * 0.96;
      const y = 0.4 + Math.random() * 0.52;
      const depth = (y - 0.4) / 0.52;
      const size = unit * (0.032 + depth * 0.045) + Math.random() * 6;
      const dist = Math.hypot(x - cx, y - cy);
      flowers.push(makeRose(x, y, size, { delay: dist * 1.5 + Math.random() * 0.3, t: reduceMotion ? 1 : 0 }));
    }
    flowers.sort((a, b) => a.y - b.y);
  }

  /* ---------- Cánh hồng rơi ---------- */
  const petalCanvas = document.getElementById("petals");
  const pctx = petalCanvas.getContext("2d");
  let psz = fit(petalCanvas, pctx);
  const petals = [];
  let petalsOn = false;

  function newPetal(fromTop, x, y) {
    return {
      x: x !== undefined ? x : Math.random() * psz.w,
      y: y !== undefined ? y : (fromTop ? -20 : Math.random() * psz.h),
      r: 7 + Math.random() * 7,
      vy: 0.4 + Math.random() * 0.6,
      vx: (Math.random() - 0.5) * 0.4,
      rot: Math.random() * TAU,
      vr: (Math.random() - 0.5) * 0.04,
      flip: Math.random() * TAU,
      vf: 0.03 + Math.random() * 0.05,
      ph: Math.random() * TAU,
      pal: PALETTES[Math.floor(Math.random() * PALETTES.length)]
    };
  }
  function burstAt(x, y, count) {
    if (reduceMotion) return;
    for (let i = 0; i < count; i++) {
      const p = newPetal(false, x, y);
      const a = Math.random() * TAU, sp = 1.5 + Math.random() * 3.5;
      p.vx = Math.cos(a) * sp;
      p.vy = Math.sin(a) * sp - 1.5;
      petals.push(p);
    }
  }
  function drawPetals(now) {
    pctx.clearRect(0, 0, psz.w, psz.h);
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];
      p.vy = Math.min(p.vy + 0.03, 1.2);
      p.y += p.vy;
      p.x += p.vx + Math.sin(now / 900 + p.ph) * 0.45;
      p.vx *= 0.985;
      p.rot += p.vr;
      p.flip += p.vf;
      if (p.y > psz.h + 30) {
        if (petals.length > 22 || !petalsOn) { petals.splice(i, 1); continue; }
        petals[i] = newPetal(true);
        continue;
      }
      const r = p.r;
      pctx.save();
      pctx.translate(p.x, p.y);
      pctx.rotate(p.rot);
      pctx.scale(Math.max(0.15, Math.abs(Math.cos(p.flip))), 1);
      const g = pctx.createLinearGradient(0, r, 0, -r);
      g.addColorStop(0, p.pal.mid);
      g.addColorStop(1, p.pal.edge);
      pctx.fillStyle = g;
      pctx.globalAlpha = 0.9;
      pctx.beginPath();
      pctx.moveTo(0, r);
      pctx.bezierCurveTo(-r * 1.1, r * 0.2, -r * 0.7, -r, 0, -r * 0.75);
      pctx.bezierCurveTo(r * 0.7, -r, r * 1.1, r * 0.2, 0, r);
      pctx.fill();
      pctx.restore();
    }
  }

  /* ---------- Màn 3: thiệp ---------- */
  const cardCanvas = document.getElementById("cardRose");
  const cctx = cardCanvas.getContext("2d");
  let csz = { w: 0, h: 0 };
  let cardStart = null;
  const cardRose = { pal: PALETTES[0], seed: 0.4 };

  /* ---------- Chuyển màn ---------- */
  const introScreen = document.getElementById("introScreen");
  const caption = document.getElementById("gardenCaption");
  const cardScreen = document.getElementById("cardScreen");
  const flowerBtn = document.getElementById("flowerBtn");
  let opened = false;

  flowerBtn.addEventListener("click", function (e) {
    if (opened) return;
    opened = true;
    const rect = flowerBtn.getBoundingClientRect();
    const hx = rect.left + rect.width * 0.5, hy = rect.top + rect.height * 0.3;
    burstAt(hx, hy, 30);
    let cx = 0.5, cy = 0.6;
    if (e.clientX || e.clientY) { cx = e.clientX / gsz.w; cy = e.clientY / gsz.h; }
    plantGarden(cx, cy);
    gardenStart = performance.now();
    introScreen.classList.add("out");
    gardenCanvas.classList.add("on");
    setTimeout(() => caption.classList.add("on"), 500);
    if (!reduceMotion) {
      petalsOn = true;
      for (let i = 0; i < 16; i++) petals.push(newPetal(true, undefined, -Math.random() * psz.h));
    }
    setTimeout(showCard, CONFIG.thoiGianVuonHoa);
  });

  function showCard() {
    caption.classList.remove("on");
    cardScreen.classList.add("on");
    cardScreen.setAttribute("aria-hidden", "false");
    introScreen.hidden = true;
    csz = fit(cardCanvas, cctx);
    cardStart = performance.now() + 300;
    document.getElementById("giftBtn").focus({ preventScroll: true });
  }

  const giftBtn = document.getElementById("giftBtn");
  const toast = document.getElementById("toast");
  giftBtn.addEventListener("click", function () {
    const r = giftBtn.getBoundingClientRect();
    burstAt(r.left + r.width / 2, r.top + r.height / 2, 34);
    giftBtn.disabled = true;
    toast.hidden = false;
  });

  /* ---------- Vòng lặp ---------- */
  window.addEventListener("resize", function () {
    if (!introScreen.hidden) { isz = fit(introCanvas, ictx); sizeHero(); }
    gsz = fit(gardenCanvas, gctx);
    psz = fit(petalCanvas, pctx);
    if (cardStart !== null) csz = fit(cardCanvas, cctx);
  });

  (function loop(now) {
    if (!introScreen.hidden) {
      if (!reduceMotion) hero.t = clamp01((now - introStart) / 2600);
      ictx.clearRect(0, 0, isz.w, isz.h);
      drawRose(ictx, hero, isz.w, isz.h, now, { shadow: true, breathe: hero.t >= 1 });
      if (hero.t >= 1) drawSparkles(ictx, introSparkles, isz.w, isz.h, now);
    }
    if (gardenStart !== null) {
      const elapsed = (now - gardenStart) / 1000;
      for (const f of flowers) {
        if (f.t < 1) f.t = clamp01((elapsed - f.delay) / 1.6);
      }
      gctx.clearRect(0, 0, gsz.w, gsz.h);
      for (const f of flowers) drawRose(gctx, f, gsz.w, gsz.h, now, { cache: true });
      drawSparkles(gctx, gardenSparkles, gsz.w, gsz.h, now);
    }
    if (cardStart !== null && csz.w) {
      const open = reduceMotion ? 1 : clamp01((now - cardStart) / 2200);
      cctx.clearRect(0, 0, csz.w, csz.h);
      cctx.save();
      cctx.translate(csz.w / 2, csz.h / 2 + 4);
      cctx.rotate(reduceMotion ? 0 : Math.sin(now / 2400) * 0.08);
      drawRoseHead(cctx, csz.w * 0.36, Math.max(0.05, open), cardRose.pal, cardRose.seed, true);
      cctx.restore();
    }
    if (petalsOn || petals.length) drawPetals(now);
    requestAnimationFrame(loop);
  })(performance.now());
})();
</script>
</body>
</html>
